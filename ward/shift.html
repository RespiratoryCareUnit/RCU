<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0154ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RCU1">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RCU บันทึกเวร — ตัวอย่าง</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#0d3b8c; --navy-deep:#082a66; --sky:#e8f0fd; --paper:#fbfaf7;
    --ink:#1c2333; --line:#d8dfef; --amber:#c47a1f; --ok:#1f7a4d; --danger:#b9432f;
    --shift-night:#3a4a8f; --shift-morn:#c47a1f; --shift-aft:#1f7a4d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  header{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;padding:18px 16px 14px;}
  header h1{margin:0;font-size:1.15rem;font-weight:700;}
  header p{margin:4px 0 0;font-size:.78rem;opacity:.85;}
  a.back{color:#cfe0ff;font-size:.75rem;text-decoration:none;}

  .toprow{display:flex;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;}
  .toprow label{font-size:.75rem;color:#555;display:block;margin-bottom:2px;}
  .toprow input[type=date]{padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;}
  .shift-picker{display:flex;gap:6px;}
  .shift-btn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:.82rem;cursor:pointer;font-weight:600;color:#555;}
  .shift-btn[data-shift="ดึก"].active{background:var(--shift-night);color:#fff;border-color:var(--shift-night);}
  .shift-btn[data-shift="เช้า"].active{background:var(--shift-morn);color:#fff;border-color:var(--shift-morn);}
  .shift-btn[data-shift="บ่าย"].active{background:var(--shift-aft);color:#fff;border-color:var(--shift-aft);}

  nav.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch;}
  nav.tabs button{flex:0 0 auto;padding:11px 14px;background:none;border:none;font-size:.8rem;font-weight:600;color:#7a8399;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
  nav.tabs button.active{color:var(--navy);border-bottom-color:var(--navy);}

  main{padding:14px 16px 28px;max-width:720px;margin:0 auto;}
  section.panel{display:none;}
  section.panel.active{display:block;}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 10px;font-size:.88rem;color:var(--navy-deep);border-left:4px solid var(--navy);padding-left:8px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .field{margin-bottom:8px;}
  .field label{display:block;font-size:.72rem;color:#666;margin-bottom:3px;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:.85rem;font-family:inherit;background:#fff;
  }
  .field textarea{resize:vertical;min-height:38px;}
  .mini-table{width:100%;border-collapse:collapse;font-size:.78rem;}
  .mini-table th{background:var(--sky);padding:6px 4px;font-size:.7rem;color:var(--navy-deep);}
  .mini-table td{padding:4px;border-bottom:1px solid #f0f0f0;}
  .mini-table input{width:100%;padding:5px;border:1px solid var(--line);border-radius:5px;font-size:.8rem;text-align:center;}

  .proc-group h4{font-size:.76rem;color:var(--amber);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.02em;}
  .month-range-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .mr-title{font-size:.84rem;font-weight:700;color:var(--navy-deep);margin-bottom:8px;}
  .mr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mr-row label{font-size:.75rem;color:#666;}
  .mr-row input[type=month]{flex:1;min-width:120px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:.82rem;font-family:inherit;}
  .month-range-box .export-btn{margin-bottom:0;}
  .exp-mode-row{display:flex;gap:6px;margin-bottom:10px;}
  .exp-mode-btn{flex:1;padding:8px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;}
  .exp-mode-btn.active{background:var(--navy);color:#fff;}

  .proc-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;flex-wrap:wrap;}
  .proc-toolbar-btns{display:flex;gap:6px;align-items:center;}
  .proc-shift-tag{font-size:.74rem;font-weight:700;padding:4px 9px;border-radius:6px;color:#fff;}
  .proc-shift-tag.shift-ดึก{background:var(--shift-night);}
  .proc-shift-tag.shift-เช้า{background:var(--shift-morn);}
  .proc-shift-tag.shift-บ่าย{background:var(--shift-aft);}
  .btn-proc-copy{background:#fff;border:1.5px solid var(--navy);color:var(--navy);border-radius:6px;padding:4px 8px;font-size:.68rem;font-weight:700;cursor:pointer;}
  .proc-row input:disabled{background:#eef0f4;color:#777;opacity:1;}
  .proc-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f2f2f2;}
  .proc-row .lbl{flex:1;font-size:.8rem;}
  .proc-row .unit{font-size:.68rem;color:#999;width:34px;}
  .proc-row input{width:56px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:.85rem;}

  .diag-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f2f2f2;}
  .diag-row label{flex:1;font-size:.82rem;}
  .diag-row input{width:56px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center;}

  .staff-select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;margin-bottom:10px;}

  .export-btn{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1.5px solid var(--navy);color:var(--navy-deep);border-radius:10px;padding:13px 14px;font-size:.85rem;font-weight:700;margin-bottom:10px;cursor:pointer;text-align:left;}
  .export-btn .icon{font-size:1.3rem;}
  .export-btn small{display:block;font-weight:400;color:#777;font-size:.72rem;margin-top:2px;}
  .export-btn:active{background:var(--sky);}
  .export-all{background:var(--navy);color:#fff;border-color:var(--navy);}
  .export-all small{color:rgba(255,255,255,.8);}

  .note{font-size:.74rem;color:#8a6d1f;background:#fff8e8;border:1px solid #f0dfa8;border-radius:8px;padding:9px 11px;margin-bottom:14px;line-height:1.5;}
  .syncbar{background:#eef3fb;border-bottom:1px solid var(--line);padding:6px 14px;text-align:center;}
  #sync-status{font-size:.7rem;color:#5a6a86;}
  #sync-status.ok{color:#14653a;} #sync-status.bad{color:#b9432f;} #sync-status.busy{color:#8a6d1f;}

  .report-title{font-weight:700;font-size:1rem;margin:0 0 4px;text-align:center;}

  .view-btn{display:block;width:calc(100% - 8px);background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px;font-size:.8rem;font-weight:700;margin:0 4px 12px;cursor:pointer;}
  .report-sub{font-size:.86rem;margin:0 0 14px;text-align:center;color:#555;}
  table.report-table{width:100%;border-collapse:collapse;font-size:.8rem;}
  table.report-table th, table.report-table td{border:1px solid #999;padding:5px 7px;text-align:left;}
  table.report-table th{background:#eef1f8;color:var(--navy-deep);text-align:center;}
  table.report-table td.rlabel{font-weight:600;background:#fbfbfd;width:32%;}
  table.report-table td.rshift{text-align:center;}
  tr.rsection td{background:var(--sky);font-weight:700;color:var(--navy-deep);}

  .popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;}
  .popup-box{background:#fff;border-radius:14px;padding:20px;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .popup-box p{margin:0 0 16px;font-size:.85rem;line-height:1.6;color:var(--ink);white-space:pre-line;}
  .popup-ok-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px;font-size:.85rem;font-weight:700;cursor:pointer;}

  table.daily-table input.input-invalid{border-color:var(--danger) !important;background:#fdecea !important;color:var(--danger) !important;}
  .yn{display:flex;gap:14px;}
  .yn label{display:flex;align-items:center;gap:4px;font-size:.8rem;}

  .local-shift-picker{display:none;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);align-items:center;}
  .local-shift-picker span{font-size:.75rem;color:#666;margin-right:4px;}

  .daily-section-title{font-size:.82rem;font-weight:700;color:var(--navy-deep);margin:16px 4px 8px;}
  .scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 3px rgba(13,59,140,.06);}
  table.daily-table{width:100%;min-width:480px;border-collapse:collapse;font-size:.78rem;background:#fff;table-layout:fixed;}
  table.daily-table.staff-table{min-width:620px;}
  table.daily-table.p4pd-table{min-width:0;}
  table.daily-table.p4pd-table input{min-width:0;font-size:.78rem;padding:6px 2px;}
  table.daily-table.p4pd-table td.label{font-size:.64rem;}
  table.daily-table.p4pd-table th{font-size:.66rem;}
  table.daily-table tr.p4pd-linked td{background:#f4f6fa;}
  table.daily-table tr.p4pd-linked input{background:#eef0f4;color:#555;font-weight:600;}
  .p4pd-hint{font-size:.66rem;color:#888;margin:6px 4px 0;}
  .p4pd-submit-row{display:flex;margin:10px 0 0;}
  .p4pd-submit-spacer{flex:0 0 104px;}
  .p4pd-submit-cell{flex:1;min-width:0;margin:0 2px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 4px;}
  .p4pd-submit-label{font-size:.68rem;font-weight:700;color:#fff;padding:2px 8px;border-radius:5px;}
  .p4pd-submit-label.shift-ดึก{background:var(--shift-night);}
  .p4pd-submit-label.shift-เช้า{background:var(--shift-morn);}
  .p4pd-submit-label.shift-บ่าย{background:var(--shift-aft);}
  table.daily-table.p4pd-table input:disabled{background:#eef0f4 !important;color:#888 !important;opacity:1;}
  table.daily-table .sticky-col, table.daily-table td.label{position:sticky;left:0;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,.08);}
  table.daily-table tr:first-child>th:first-child{z-index:4;}
  table.daily-table th{background:var(--sky);color:var(--navy-deep);padding:6px 4px;font-size:.7rem;border:1px solid var(--line);white-space:nowrap;}
  table.daily-table th.hd-ดึก{background:#dfe3f5;color:var(--shift-night);}
  table.daily-table th.hd-เช้า{background:#faecd9;color:var(--shift-morn);}
  table.daily-table th.hd-บ่าย{background:#dcefe1;color:var(--shift-aft);}
  table.daily-table td{padding:3px;border:1px solid var(--line);text-align:center;vertical-align:middle;}
  table.daily-table td.label{text-align:left;padding-left:6px;font-size:.68rem;white-space:normal;line-height:1.25;background:#fbfbfd;}
  table.daily-table input, table.daily-table select{width:100%;padding:6px 3px;border:1px solid var(--line);border-radius:5px;font-size:.8rem;text-align:center;font-family:inherit;min-width:52px;}
  table.daily-table input[readonly]{background:#eef0f4;color:#555 !important;font-weight:700 !important;}
  table.daily-table input:disabled, table.daily-table select:disabled{background:#eef0f4 !important;color:#777 !important;font-weight:400 !important;opacity:1;}

  .event-card{border-radius:12px;padding:12px;margin-bottom:12px;}
  .event-card.card-ดึก{background:#f6f4e4;}
  .event-card.card-เช้า{background:#fceaf3;}
  .event-card.card-บ่าย{background:#e5eff8;}
  .event-card h4{margin:0 0 10px;font-size:.86rem;}
  .event-card.card-ดึก h4{color:var(--shift-night);}
  .event-card.card-เช้า h4{color:var(--shift-morn);}
  .event-card.card-บ่าย h4{color:var(--shift-aft);}
  .event-field{margin-bottom:8px;}
  .event-field label{display:block;font-size:.7rem;color:#666;margin-bottom:2px;}
  .event-field input, .event-field select, .event-field textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:.8rem;font-family:inherit;background:#fff;}
  .event-field textarea{min-height:44px;resize:vertical;}
  .event-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .event-field input[readonly]{background:#f0f0f0;color:#555;}
  .germ-pairs{margin-top:8px;display:flex;flex-direction:column;gap:6px;}

  .event-scroll-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .event-card-slot{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;padding-right:6px;}

  .submitted-tag{font-size:.7rem;color:var(--navy);font-weight:400;margin-left:6px;}
  .event-submit-row{margin-top:10px;display:flex;justify-content:flex-end;}
  .btn-event-submit{background:#7fc79a;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:.68rem;font-weight:700;cursor:pointer;}
  .btn-event-edit{background:var(--danger);border:none;color:#fff;border-radius:6px;padding:4px 8px;font-size:.68rem;font-weight:700;cursor:pointer;}
  .event-field select[disabled], .event-field input[disabled], .event-field textarea[disabled]{background:#f2f2f2;color:#777;opacity:1;}

  table.daily-table input[data-shift="ดึก"], table.daily-table select[data-shift="ดึก"]{color:var(--shift-night);font-weight:600;}
  table.daily-table input[data-shift="เช้า"], table.daily-table select[data-shift="เช้า"]{color:var(--shift-morn);font-weight:600;}
  table.daily-table input[data-shift="บ่าย"], table.daily-table select[data-shift="บ่าย"]{color:var(--shift-aft);font-weight:600;}

  table.daily-table tr.care-group-misc td{background:#fff;}
  table.daily-table tr.care-group-sedative td{background:#eaf1fc;}
  table.daily-table tr.care-group-sedative td.label{background:#dbe8fa;}
  table.daily-table tr.care-group-cvp td{background:#fdf3e3;}
  table.daily-table tr.care-group-cvp td.label{background:#fae7c8;}
  table.daily-table tr.care-group-vent td{background:#e8f6ec;}
  table.daily-table tr.care-group-vent td.label{background:#d7f0dd;}
  table.daily-table tr.care-group-vap td{background:#f4e9fb;}
  table.daily-table tr.care-group-vap td.label{background:#e9d7f7;}
  table.daily-table tr.care-group-tpiece td{background:#fde9ec;}
  table.daily-table tr.care-group-tpiece td.label{background:#fbd7dd;}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">‹ กลับเมนูหลัก</a>
  <h1>บันทึกเหตุการณ์รายวัน</h1>
</header>

<div class="syncbar">
  <span id="sync-status">กำลังเชื่อมส่วนกลาง...</span>
</div>

<div class="toprow">
  <div>
    <label>วันที่</label>
    <input type="date" id="rec-date">
  </div>
</div>

<nav class="tabs">
  <button data-tab="daily" class="active">📋 บันทึกประจำวัน</button>
  <button data-tab="proc">🔧 หัตถการ</button>
  <button data-tab="p4pd">📊 p4p รายวัน</button>
  <button data-tab="export">📤 Export</button>
</nav>

<div class="local-shift-picker" id="local-shift-picker">
  <span>กำลังกรอกเวร:</span>
  <button class="shift-btn" data-shift="ดึก">ดึก</button>
  <button class="shift-btn" data-shift="เช้า">เช้า</button>
  <button class="shift-btn" data-shift="บ่าย">บ่าย</button>
</div>

<main>

<!-- DAILY (unified 3-shift page, matches the real report layout) -->
<section class="panel active" id="daily">
  <button class="view-btn" id="btn-view-daily">📄 รายงานบันทึกประจำวัน</button>
  <div id="daily-table-wrap"></div>
</section>

<!-- PROCEDURES -->
<section class="panel" id="proc">
  <div id="proc-list"></div>
</section>

<!-- DIAGNOSIS -->
<!-- P4P DAILY -->
<section class="panel" id="p4pd">
  <div class="daily-section-title">ภาระงานบริการ</div>
  <div id="p4pd-list"></div>
  <div class="daily-section-title">Diagnosis</div>
  <div id="diag-list"></div>
  <div class="p4pd-submit-row" id="p4pd-submit-row"></div>
</section>

<!-- EXPORT -->
<section class="panel" id="export">

  <div class="month-range-box">
    <div class="mr-title">ช่วงข้อมูลที่จะ Export</div>
    <div class="exp-mode-row">
      <button type="button" class="exp-mode-btn active" data-mode="day">รายวัน</button>
      <button type="button" class="exp-mode-btn" data-mode="month">รายเดือน</button>
    </div>
    <div class="mr-row" id="exp-day-row">
      <label>วันที่</label><input type="date" id="exp-date">
    </div>
    <div class="mr-row" id="exp-month-row" style="display:none;">
      <label>ตั้งแต่</label><input type="month" id="mr-from">
      <label>ถึง</label><input type="month" id="mr-to">
    </div>
  </div>

  <button class="export-btn" id="btn-export-hattakan">
    <span class="icon">🔧</span>
    <span>หัตถการ<small>1 ชีทต่อเดือน + ชีทสรุปรวม (โหมดรายวัน = เฉพาะวันนั้น)</small></span>
  </button>
  <button class="export-btn" id="btn-export-p4pdaily">
    <span class="icon">🩺</span>
    <span>p4p รายวัน<small>ภาระงาน + Diagnosis แยก 3 เวร</small></span>
  </button>
  <button class="export-btn" id="btn-export-pdf" style="border-color:var(--ok);color:var(--ok);">
    <span class="icon">📄</span>
    <span>แบบบันทึกเหตุการณ์_RCU (PDF)<small>1 แผ่น = 1 วันที่ แสดงครบ 3 เวร</small></span>
  </button>
</section>

</main>

<div class="popup-overlay" id="popup-overlay" style="display:none;">
  <div class="popup-box">
    <p id="popup-message"></p>
    <button type="button" class="popup-ok-btn" id="popup-ok">ตกลง</button>
  </div>
</div>

<div id="pdf-report-container" style="display:none;"></div>


<script>
/* ---------------- data model ---------------- */
const SHIFTS = ["ดึก","เช้า","บ่าย"];
const THAI_MONTHS = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const THAI_MONTHS_FULL = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

let currentShift = "ดึก";
const INCHARGE_ROSTER = ["ผ่องนภา สงวนสิน","รวิวรรณ ปรียานุภาพ","พนิดา นิติสารวงศ์","กรรณิกา งามลา","มงคล เถื่อนศรี","วรัญญา ศรีทรัพย์พานิช","ลลิดา รู้ด่านกลาง","กันยารัตน์ สินปรุ","เยาวลักษณ์ วายุระกุล","ศรีสุดา มิตรสูงเนิน","อติพร ธรรมดี","นันทวี แสนใจงาม","จิราภรณ์ สุดมี","สุภรัตน์ เฉิดจังหรีด","สุลักษณา อรรถพันธ์กุล","ระพีภัทร ตาเมือง","กมลพรรณ ดุมใหม่"];
function emptyShift(){ return {}; }
function emptyDay(){ return { shifts: { "ดึก": emptyShift(), "เช้า": emptyShift(), "บ่าย": emptyShift() },
  procState: { "ดึก":"editing", "เช้า":"editing", "บ่าย":"editing" },
  eventState: { "ดึก":"editing", "เช้า":"editing", "บ่าย":"editing" } }; }

const STORE_KEY = "rcu_daily_records_v1";
let allDays = {};          // allDays["2026-09-01"] = emptyDay()
let currentDateKey = "";   // which date is loaded into `data`
let data = emptyDay();     // the day currently being edited

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    allDays = raw ? JSON.parse(raw) : {};
  }catch(e){ allDays = {}; }
}
function saveStore(){
  try{
    if(currentDateKey) allDays[currentDateKey] = data;
    localStorage.setItem(STORE_KEY, JSON.stringify(allDays));
  }catch(e){ console.error("บันทึกไม่สำเร็จ", e); }
}
// switch the editor to a given date, saving whatever was open before
function switchToDate(dateKey){
  if(currentDateKey && currentDateKey !== dateKey) saveStore();
  currentDateKey = dateKey;
  if(!allDays[dateKey]) allDays[dateKey] = emptyDay();
  data = allDays[dateKey];
  // keep the per-tab lock states in sync with this day's saved state
  procEditState = data.procState || (data.procState = { "ดึก":"editing", "เช้า":"editing", "บ่าย":"editing" });
  shiftEditState = data.eventState || (data.eventState = { "ดึก":"editing", "เช้า":"editing", "บ่าย":"editing" });
  p4pdEditState = data.p4pdState || (data.p4pdState = { "ดึก":"editing", "เช้า":"editing", "บ่าย":"editing" });
}

function getShiftData(){ return data.shifts[currentShift]; }
function setDeep(obj, path, val){
  const parts = path.split(".");
  let o = obj;
  for(let i=0;i<parts.length-1;i++){ o[parts[i]] = o[parts[i]] || {}; o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function getDeep(obj, path){
  const parts = path.split(".");
  let o = obj;
  for(const p of parts){ if(o==null) return undefined; o = o[p]; }
  return o;
}

function showPopup(message){
  document.getElementById("popup-message").textContent = message;
  document.getElementById("popup-overlay").style.display = "flex";
}
document.getElementById("popup-ok").addEventListener("click", ()=>{

  let html = `<div class="proc-toolbar">

document.getElementById("proc-list").addEventListener("click", (e)=>{
  if(e.target.closest("#btn-proc-submit")){
    procEditState[currentShift] = "submitted";
    saveStore();
    renderProcList();
  } else if(e.target.closest("#btn-proc-edit")){
    procEditState[currentShift] = "editing";
    saveStore();
    renderProcList();
  } else if(e.target.closest("#btn-proc-copy")){
    const prevShift = SHIFTS[SHIFTS.indexOf(currentShift) - 1];
    if(!prevShift) return;
    const prevData = getDeep(data.shifts[prevShift], "proc") || {};
    let copied = 0;
    Object.entries(prevData).forEach(([key,val])=>{
      if(val !== undefined && val !== null && String(val).trim() !== ""){
        setDeep(data.shifts[currentShift], `proc.${key}`, val);
        copied++;
      }
    });
    saveStore();   // programmatic change: no input event fires, so persist explicitly
    renderProcList();
    showPopup(copied > 0
      ? `คัดลอกจากเวร${prevShift} แล้ว ${copied} รายการ — แก้ไขได้ก่อนกด Submit`
      : `เวร${prevShift} ยังไม่มีข้อมูลหัตถการให้คัดลอก`);
  }
});

// RN+TN incl. OT = RN(ปกติ+OT) + NA(ปกติ+OT) already entered in the daily table
function computeRnTn(sh){
  const n = p=>{ const v=parseFloat(getDeep(data.shifts[sh],p)); return isNaN(v)?0:v; };
  return n("staff.RN.normal")+n("staff.RN.ot")+n("staff.NA.normal")+n("staff.NA.ot");
}
function renderP4pdList(){
  const el = document.getElementById("p4pd-list");

    <col style="width:calc((100vw - 140px)/3)"><col style="width:calc((100vw - 140px)/3)"><col style="width:calc((100vw - 140px)/3)">

  </tr>`;
  P4PD_ROWS.forEach(([label,path,mode])=>{
    const linked = (mode === "link" || mode === "rntn");
    html += `<tr${linked?' class="p4pd-linked"':''}><td class="label">${label}</td>`;
    SHIFTS.forEach(sh=>{
      const locked = p4pdEditState[sh] === "submitted";
      if(mode === "rntn"){
        html += `<td><input type="text" readonly value="${computeRnTn(sh)}"></td>`;

        const v = getDeep(data.shifts[sh], path);
        html += `<td><input type="text" readonly value="${v!==undefined&&v!==null?v:""}"></td>`;
      } else {
        const v = getDeep(data.shifts[sh], path);
        html += `<td><input type="text" inputmode="decimal" ${locked?"disabled":""} data-shift="${sh}" data-pd="${path}" value="${v!==undefined&&v!==null?v:""}"></td>`;
      }
    });
    html += `</tr>`;

  html += `</table></div>

}

// keep บุคลากร&สถิติผู้ป่วย, การพยาบาลพิเศษ and the event cards scrolled to the same shift
function attachDailyScrollSync(){
  const staff = document.getElementById("scroll-staff");
  const care  = document.getElementById("scroll-care");
  const events = document.getElementById("event-scroll-row");
  const parts = [staff, care, events].filter(Boolean);
  let syncing = false;
  parts.forEach(src=>{
    src.addEventListener("scroll", ()=>{
      if(syncing) return;
      syncing = true;
      // translate position into a 0..1 ratio so differing widths still line up
      const ratio = src.scrollWidth > src.clientWidth
        ? src.scrollLeft / (src.scrollWidth - src.clientWidth) : 0;
      parts.forEach(other=>{
        if(other === src) return;
        const max = other.scrollWidth - other.clientWidth;
        if(max > 0) other.scrollLeft = ratio * max;
      });
      requestAnimationFrame(()=>{ syncing = false; });
    });
  });
}

function validateEventCard(sh){
  const sd = data.shifts[sh];
  const g = (p)=> { const v = getDeep(sd,p); return v!==undefined&&v!==null? String(v).trim() : ""; };
  const missing = [];

  const productivity = getDeep(data.shifts[sh], "productivity");
  if(productivity === undefined || productivity === null || String(productivity).trim() === "") missing.push("Productivity");

  const staffStatus = g('events.staffStatus') || STAFF_STATUS_OPTIONS[0];
  if(staffStatus !== STAFF_STATUS_OPTIONS[0] && !g('events.staffCount')) missing.push("จำนวนเจ้าหน้าที่ (ราย)");

  const generalStatus = g('events.general') || GENERAL_OPTIONS[0];
  if(generalStatus === GENERAL_OPTIONS[1] && !g('events.generalDetail')) missing.push("รายละเอียดเหตุการณ์ทั่วไป");

  const ethicsStatus = g('events.ethics') || ETHICS_OPTIONS[0];
  if(ethicsStatus === ETHICS_OPTIONS[1] && !g('events.ethicsDetail')) missing.push("รายละเอียดความเสี่ยงจริยธรรม");

  const germStatus = g('events.germStatus') || GERM_OPTIONS[0];
  if(germStatus === GERM_OPTIONS[1] && (!g('events.germBeds1') || !g('events.germType1'))) missing.push("เตียง/เชื้อ (อย่างน้อย 1 คู่)");

  if(!g('incharge')) missing.push("Incharge");

  if(!g('staff.RN.normal')) missing.push("RN");
  if(!g('staff.NA.normal')) missing.push("NA");
  if(!g('staff.W.normal')) missing.push("W (คนงาน)");
  if(!g('ptype.p5')) missing.push("ผป.ประเภท 5");
  if(!g('ptype.p4')) missing.push("ผป.ประเภท 4");
  if(!g('ptype.p3')) missing.push("ผป.ประเภท 3");
  if(!g('ptype.p2')) missing.push("ผป.ประเภท 2");

  if(invalidRemainShifts.has(sh)) missing.push("ยอดคงพยาบาลไม่ถูกต้อง (เกิน 8 เตียง หรือติดลบ) — ตรวจสอบยอดรับ/ย้าย/จำหน่าย");

  return missing;
}

const REMAIN_INPUT_PATHS = ["census.carry","census.newAdmit","census.transferIn","census.discharge","census.transferOut","census.dead"];
function computeRemain(sh){
  const sd = data.shifts[sh];
  const num = (path)=> { const v = getDeep(sd, path); const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  return num("census.carry") + num("census.newAdmit") + num("census.transferIn")
       - num("census.discharge") - num("census.transferOut") - num("census.dead");
}
let invalidRemainShifts = new Set();
function updateRemainDisplay(sh){
  const val = computeRemain(sh);
  setDeep(data.shifts[sh], "census.remain", val);
  const el = document.querySelector(`#daily-table-wrap input[data-shift="${sh}"][data-f="census.remain"]`);
  if(el) el.value = val;
  renderP4pdList(); // คงพยาบาล is mirrored into the p4p tab

  if(val > 8 || val < 0){
    invalidRemainShifts.add(sh);
    if(el) el.classList.add("input-invalid");
    showPopup(`เวร${sh}: คำนวณคงพยาบาลได้ ${val} คน ไม่ถูกต้อง (ต้องอยู่ระหว่าง 0-8 เตียง)\nกรุณาตรวจสอบยอดยกมา/รับใหม่/รับย้าย/จำหน่าย/ย้าย-ส่งต่อ/ถึงแก่กรรม`);
  } else {
    invalidRemainShifts.delete(sh);
    if(el) el.classList.remove("input-invalid");
  }

  const idx = SHIFTS.indexOf(sh);
  const nextShift = SHIFTS[idx+1];
  if(nextShift){
    setDeep(data.shifts[nextShift], "census.carry", val);
    const nextInput = document.querySelector(`#daily-table-wrap input[data-shift="${nextShift}"][data-f="census.carry"]`);
    if(nextInput) nextInput.value = val;
    updateRemainDisplay(nextShift); // cascade: next shift's own remain depends on its carry too
  }
}

const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxRfc7crS3I3rC6UP-9FDOka5QdszFEJaF4dGsBTbyL-mZQC1GdFCGc-hupoPKXUaVt/exec";
const CLOUD_KIND = "shift";

function setSync(msg, cls){
  const el = document.getElementById("sync-status");
  el.textContent = msg;
  el.className = cls || "";
}

// pull every day from the sheet and merge in; server wins for days it knows about
async function cloudLoad(silent){
  setSync("กำลังโหลดจากส่วนกลาง...", "busy");
  try{
    const res = await fetch(`${CLOUD_URL}?kind=${CLOUD_KIND}&all=1`);
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "โหลดไม่สำเร็จ");
    const days = j.data || {};
    let n = 0;
    Object.keys(days).forEach(k=>{ allDays[k] = days[k]; n++; });
    localStorage.setItem(STORE_KEY, JSON.stringify(allDays));
    // re-open the current date so the screen shows what just arrived
    switchToDate(currentDateKey);
    renderAllForCurrentDay();
    setSync(`โหลดแล้ว ${n} วัน — ${new Date().toLocaleTimeString("th-TH")}`, "ok");
  }catch(err){
    setSync("โหลดไม่สำเร็จ: " + (err.message || err), "bad");
    if(!silent) showPopup("โหลดข้อมูลจากส่วนกลางไม่สำเร็จ\n" + (err.message || err));
  }
}

// push the day currently open
async function cloudSave(silent){
  setSync("กำลังบันทึกขึ้นส่วนกลาง...", "busy");
  try{
    saveStore();
    const res = await fetch(CLOUD_URL, {
      method: "POST",
      // text/plain avoids the CORS preflight that Apps Script cannot answer
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ kind: CLOUD_KIND, date: currentDateKey, data: allDays[currentDateKey] || {} })
    });
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "บันทึกไม่สำเร็จ");
    setSync(`บันทึกวันที่ ${j.saved} แล้ว — ${j.at}`, "ok");
  }catch(err){
    setSync("บันทึกไม่สำเร็จ: " + (err.message || err), "bad");
    if(!silent) showPopup("บันทึกขึ้นส่วนกลางไม่สำเร็จ\n" + (err.message || err));
  }
}

let cloudTimer = null;
let cloudDirty = false;
function scheduleCloudSave(){
  if(!currentDateKey) return;
  cloudDirty = true;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(()=>{ cloudDirty = false; cloudSave(true); }, 1500);
}
document.addEventListener("input", scheduleCloudSave);
document.addEventListener("change", scheduleCloudSave);

// flush anything still pending if the tab is closed or backgrounded
window.addEventListener("beforeunload", ()=>{
  if(!cloudDirty || !currentDateKey) return;
  saveStore();
  const body = JSON.stringify({ kind: CLOUD_KIND, date: currentDateKey, data: allDays[currentDateKey] || {} });
  navigator.sendBeacon && navigator.sendBeacon(CLOUD_URL, new Blob([body], {type:"text/plain;charset=utf-8"}));
});
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden" && cloudDirty){ clearTimeout(cloudTimer); cloudDirty=false; cloudSave(true); }
});

    return (b || t) ? `เตียง${b||"-"}: ${t||"-"}` : null;
  }).filter(Boolean).join(", ");
  return `${s} (${pairs || "-"})`;
}

async function buildPdfDoc(key){
  if(typeof html2canvas === "undefined" || typeof window.jspdf === "undefined"){
    throw new Error("โหลดตัวช่วยสร้าง PDF ไม่สำเร็จ — ต้องมีอินเทอร์เน็ต และเปิดไฟล์นี้ผ่าน Chrome โดยตรง (ไม่ใช่ตัวดูไฟล์ในแอปดาวน์โหลด)");
  }
  const container = document.getElementById("pdf-report-container");
  try{
    container.innerHTML = buildDailyReportHtml(key);
    container.style.cssText = "display:block;position:fixed;left:0;top:0;z-index:-1;background:#fff;width:780px;padding:20px;";
    await new Promise(r=>setTimeout(r, 60));
    const canvas = await html2canvas(container, { scale:2, backgroundColor:"#ffffff" });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("portrait", "mm", "a4");
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL("image/png");

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    return pdf;
  } finally {
    container.style.cssText = "display:none;";
  }
}

/* ---- หัตถการ: monthly export across a month range, 1 sheet per month + summary ---- */
const THIN = {style:"thin", color:{rgb:"999999"}};
const BORDER_ALL = {top:THIN,bottom:THIN,left:THIN,right:THIN};
function styleCell(ws, addr, opts){
  if(!ws[addr]) ws[addr] = {v:"", t:"s"};
  ws[addr].s = Object.assign({border:BORDER_ALL, alignment:{vertical:"center", wrapText:true}}, opts||{});
}

function daysInMonth(year, month1){ return new Date(year, month1, 0).getDate(); }

function buildHattakanMonthSheet(year, month1, onlyDay){
  // rows: header, then each procedure (grouped), with a per-day column set and a month total
  // onlyDay: when given, the sheet covers just that one date instead of the whole month
  const dayFrom = onlyDay || 1;
  const dayTo   = onlyDay || daysInMonth(year, month1);
  const nDays   = dayTo - dayFrom + 1;
  const flatItems = [];
  PROC_GROUPS.forEach(g=>{
    flatItems.push({group:true, label:g.title});
    g.items.forEach(([key,label,unit])=> flatItems.push({group:false, key, label, unit}));
  });

  const aoa = [];
  const title = onlyDay
    ? `สรุปหัตถการ — วันที่ ${onlyDay} ${THAI_MONTHS_FULL[month1]} ${year+543}`
    : `สรุปหัตถการ — ${THAI_MONTHS_FULL[month1]} ${year+543}`;
  aoa.push([title]);
  aoa.push([]);
  // two header rows: day number spanning 3 shift columns, then ด/ช/บ under each
  const headDays = ["ภาระงาน","หน่วย"];
  const headShifts = ["",""];
  for(let d=dayFrom; d<=dayTo; d++){
    headDays.push(String(d), "", "");
    headShifts.push("ด","ช","บ");
  }
  headDays.push(onlyDay ? "รวมวัน" : "รวมเดือน");
  headShifts.push("");
  aoa.push(headDays);
  aoa.push(headShifts);

  const monthTotals = {};
  flatItems.forEach(item=>{
    if(item.group){
      aoa.push([item.label]);
      return;
    }
    const row = [item.label, item.unit];
    let total = 0;
    for(let d=dayFrom; d<=dayTo; d++){
      const key = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const dayRec = allDays[key];
      SHIFTS.forEach(sh=>{
        let v = dayRec ? parseFloat(getDeep(dayRec.shifts[sh], `proc.${item.key}`)) : NaN;
        if(isNaN(v)) v = 0;
        row.push(v || "");
        total += v;
      });
    }
    row.push(total || "");
    monthTotals[item.key] = total;
    aoa.push(row);
  });

  const lastCol = 2 + nDays*3; // 0-indexed column of the "รวมเดือน" cell
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:42},{wch:7}].concat(Array(nDays*3).fill({wch:3.5}), [{wch:10}]);
  ws["!freeze"] = {xSplit:2, ySplit:4};
  const merges = [{s:{r:0,c:0}, e:{r:0,c:lastCol}}];
  for(let d=0; d<nDays; d++){
    const c = 2 + d*3;
    merges.push({s:{r:2,c}, e:{r:2,c:c+2}});           // day number spans its 3 shift columns
  }
  merges.push({s:{r:2,c:0}, e:{r:3,c:0}});             // ภาระงาน spans both header rows
  merges.push({s:{r:2,c:1}, e:{r:3,c:1}});             // หน่วย
  merges.push({s:{r:2,c:lastCol}, e:{r:3,c:lastCol}}); // รวมเดือน
  ws["!merges"] = merges;

  // styling: title, header row, group rows, total column
  styleCell(ws, "A1", {font:{bold:true, sz:14, color:{rgb:"0D3B8C"}}, alignment:{horizontal:"center"}});
  // two header rows (rows 2 and 3 zero-indexed)
  for(let c=0; c<=lastCol; c++){
    [2,3].forEach(hr=>{
      styleCell(ws, XLSX.utils.encode_cell({r:hr, c}),
        {font:{bold:true, color:{rgb:"0D3B8C"}}, fill:{fgColor:{rgb:"E8F0FD"}}, alignment:{horizontal:"center", vertical:"center"}});
    });
  }
  let r = 4; // 0-indexed row of first data line
  flatItems.forEach(item=>{
    if(item.group){
      for(let c=0; c<=lastCol; c++){
        styleCell(ws, XLSX.utils.encode_cell({r, c}),
          {font:{bold:true, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
      }
    } else {
      styleCell(ws, XLSX.utils.encode_cell({r, c:0}), {alignment:{horizontal:"left", wrapText:true}});
      styleCell(ws, XLSX.utils.encode_cell({r, c:1}), {alignment:{horizontal:"center"}});
      for(let d=0; d<nDays; d++){
        // shade alternate days so the 3-shift blocks stay visually separated
        const dayFill = (d % 2 === 1) ? {fill:{fgColor:{rgb:"F7F9FD"}}} : {};
        for(let s=0; s<3; s++){
          styleCell(ws, XLSX.utils.encode_cell({r, c:2 + d*3 + s}),
            Object.assign({alignment:{horizontal:"center"}}, dayFill));
        }
      }
      styleCell(ws, XLSX.utils.encode_cell({r, c:lastCol}),
        {font:{bold:true}, fill:{fgColor:{rgb:"FFF4E0"}}, alignment:{horizontal:"center"}});
    }
    r++;
  });

  return { ws, monthTotals };
}

function buildP4pMonthSheet(year, month1, onlyDay){
  const dayFrom = onlyDay || 1;
  const dayTo   = onlyDay || daysInMonth(year, month1);
  const nDays   = dayTo - dayFrom + 1;

  // same row order as the real form: service items, then Diagnosis
  const items = [];
  items.push({group:true, label:"ภาระงานบริการ"});
  P4PD_ROWS.forEach(([label,path,mode])=> items.push({group:false, label, path, mode}));
  items.push({group:true, label:"Diagnosis"});
  DIAG_LIST.forEach((d,i)=>{
    const depth = d.startsWith("——") ? 2 : (d.startsWith("—") ? 1 : 0);
    items.push({group:false, label:" ".repeat(depth*4) + d.replace(/^—+\s*/,""), path:`diag.d${i}`, mode:"edit"});
  });

  const aoa = [];
  aoa.push([onlyDay
    ? `ใบลงยอด P4P รายวัน — วันที่ ${onlyDay} ${THAI_MONTHS_FULL[month1]} ${year+543}`
    : `ใบลงยอด P4P รายวัน — ${THAI_MONTHS_FULL[month1]} ${year+543}`]);
  aoa.push([]);
  const headDays = ["ภาระงานบริการ"], headShifts = [""];
  for(let d=dayFrom; d<=dayTo; d++){ headDays.push(String(d),"",""); headShifts.push("ด","ช","บ"); }
  headDays.push(onlyDay ? "รวมวัน" : "รวมเดือน"); headShifts.push("");
  aoa.push(headDays); aoa.push(headShifts);

  items.forEach(item=>{
    if(item.group){ aoa.push([item.label]); return; }
    const row = [item.label];
    let total = 0;
    for(let d=dayFrom; d<=dayTo; d++){
      const key = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const rec = allDays[key];
      SHIFTS.forEach(sh=>{
        let v = 0;
        if(rec){
          if(item.mode === "rntn"){
            const n = p=>{ const x=parseFloat(getDeep(rec.shifts[sh],p)); return isNaN(x)?0:x; };
            v = n("staff.RN.normal")+n("staff.RN.ot")+n("staff.NA.normal")+n("staff.NA.ot");
          } else {
            const x = parseFloat(getDeep(rec.shifts[sh], item.path));
            v = isNaN(x) ? 0 : x;
          }
        }
        row.push(v || "");
        total += v;
      });
    }
    row.push(total || "");
    aoa.push(row);
  });

  // ---- month-end summary block (mirrors the real form's calculated rows) ----
  const sum = path=>{
    let t = 0;
    for(let d=dayFrom; d<=dayTo; d++){
      const k = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const rec = allDays[k];
      if(!rec) continue;
      SHIFTS.forEach(sh=>{ const x = parseFloat(getDeep(rec.shifts[sh], path)); if(!isNaN(x)) t += x; });
    }
    return t;
  };
  // carry-forward is a running balance, so take it from the first shift of the first recorded day
  let carryStart = 0;
  for(let d=dayFrom; d<=dayTo; d++){
    const k = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    if(allDays[k]){ const v = parseFloat(getDeep(allDays[k].shifts["ดึก"], "census.carry")); if(!isNaN(v)) carryStart = v; break; }
  }
  const bedDays     = sum("p4pd.bedDays");
  const totalAdmit  = sum("census.newAdmit") + sum("census.transferIn");
  const totalOut    = sum("census.discharge") + sum("census.transferOut") + sum("census.refer") + sum("census.dead");
  const deaths      = sum("census.dead");
  const remain      = carryStart + totalAdmit - totalOut;
  const totalPts    = carryStart + totalAdmit;
  const BEDS = 8;
  const r2 = v => Math.round(v*100)/100;

  aoa.push([]);
  aoa.push(["สรุปประจำเดือน"]);
  const summaryRows = [
    ["จำนวนวันนอนทั้งหมด", bedDays],
    ["จำนวนผู้ป่วยทั้งหมด", totalPts],
    ["ยอดยกมา", carryStart],
    ["รวมรับทั้งหมด", totalAdmit],
    ["รวมจำหน่ายทั้งหมด", totalOut],
    ["คงพยาบาล", remain],
    ["อัตราตาย (%)", totalPts ? r2(deaths*100/totalPts) : 0],
    ["อัตราครองเตียง (%)", nDays ? r2(bedDays*100/(BEDS*nDays)) : 0],
    ["จำนวนผู้ป่วยเฉลี่ยต่อวัน", nDays ? r2(bedDays/nDays) : 0],
    ["เฉลี่ยรับใหม่ต่อวัน", nDays ? r2(sum("census.newAdmit")/nDays) : 0],
    ["เฉลี่ยรับย้ายต่อวัน", nDays ? r2(sum("census.transferIn")/nDays) : 0],
  ];
  // monthly totals per movement type, shown beside the summary (cols D-E)
  const moveRows = [
    ["รับใหม่", sum("census.newAdmit")],
    ["รับย้าย", sum("census.transferIn")],
    ["ย้าย", sum("census.transferOut")],
    ["จำหน่าย", sum("census.discharge")],
    ["ไม่สมัครใจอยู่", sum("p4pd.notVoluntary")],
    ["Refer", sum("census.refer")],
    ["ถึงแก่กรรม", deaths],
  ];
  const summaryStartRow = aoa.length; // 0-indexed row of the first summary line
  summaryRows.forEach(([label,val],i)=>{
    const mv = moveRows[i];
    const row = [label, val, "", "", ""];      // value merged across cols B-D
    if(mv) row.push(mv[0], "", "", mv[1]);     // label merged F-H, value merged I-K
    aoa.push(row);
  });

  const lastCol = 1 + nDays*3;
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:40}].concat(Array(nDays*3).fill({wch:3.5}), [{wch:12}]);
  ws["!freeze"] = {xSplit:1, ySplit:4};
  const merges = [{s:{r:0,c:0}, e:{r:0,c:lastCol}}];
  for(let d=0; d<nDays; d++){ const col = 1 + d*3; merges.push({s:{r:2,c:col}, e:{r:2,c:col+2}}); }
  merges.push({s:{r:2,c:0}, e:{r:3,c:0}});
  merges.push({s:{r:2,c:lastCol}, e:{r:3,c:lastCol}});
  ws["!merges"] = merges;

  styleCell(ws, "A1", {font:{bold:true, sz:14, color:{rgb:"0D3B8C"}}, alignment:{horizontal:"center"}});
  for(let col=0; col<=lastCol; col++){
    [2,3].forEach(hr=> styleCell(ws, XLSX.utils.encode_cell({r:hr, c:col}),
      {font:{bold:true, color:{rgb:"0D3B8C"}}, fill:{fgColor:{rgb:"E8F0FD"}}, alignment:{horizontal:"center", vertical:"center"}}));
  }
  let r = 4;
  items.forEach(item=>{
    if(item.group){
      for(let col=0; col<=lastCol; col++) styleCell(ws, XLSX.utils.encode_cell({r, c:col}),
        {font:{bold:true, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
    } else {
      styleCell(ws, XLSX.utils.encode_cell({r, c:0}), {alignment:{horizontal:"left", wrapText:true}});
      for(let d=0; d<nDays; d++){
        const shade = (d % 2 === 1) ? {fill:{fgColor:{rgb:"F7F9FD"}}} : {};
        for(let s=0; s<3; s++) styleCell(ws, XLSX.utils.encode_cell({r, c:1 + d*3 + s}),
          Object.assign({alignment:{horizontal:"center"}}, shade));
      }
      styleCell(ws, XLSX.utils.encode_cell({r, c:lastCol}),
        {font:{bold:true}, fill:{fgColor:{rgb:"FFF4E0"}}, alignment:{horizontal:"center"}});
    }
    r++;
  });

  // summary header + rows
  styleCell(ws, XLSX.utils.encode_cell({r:summaryStartRow-1, c:0}),
    {font:{bold:true, sz:12, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
  styleCell(ws, XLSX.utils.encode_cell({r:summaryStartRow-1, c:1}),
    {font:{bold:true}, fill:{fgColor:{rgb:"DDE6F7"}}});
  summaryRows.forEach((_,i)=>{
    const rr = summaryStartRow + i;
    const isRate = summaryRows[i][0].includes("อัตรา");
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:0}),
      {font:{bold:isRate}, alignment:{horizontal:"left"}});
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:1}),
      {font:{bold:true, color:{rgb: isRate ? "B9432F" : "000000"}},
       fill:{fgColor:{rgb: isRate ? "FDECEA" : "FFF4E0"}}, alignment:{horizontal:"center"}});
  });
  // widen the summary + movement cells by merging across the narrow day columns
  const hdrRow = summaryStartRow - 1;
  ws["!merges"].push({s:{r:hdrRow,c:0}, e:{r:hdrRow,c:3}});
  ws["!merges"].push({s:{r:hdrRow,c:5}, e:{r:hdrRow,c:10}});
  summaryRows.forEach((_,i)=>{
    const rr = summaryStartRow + i;
    ws["!merges"].push({s:{r:rr,c:1}, e:{r:rr,c:3}});
    if(moveRows[i]){
      ws["!merges"].push({s:{r:rr,c:5}, e:{r:rr,c:7}});
      ws["!merges"].push({s:{r:rr,c:8}, e:{r:rr,c:10}});
    }
  });
  // movement-total block beside the summary
  styleCell(ws, XLSX.utils.encode_cell({r:hdrRow, c:5}),
    {font:{bold:true, color:{rgb:"B9432F"}}, fill:{fgColor:{rgb:"FDECEA"}}, alignment:{horizontal:"center"}});
  ws[XLSX.utils.encode_cell({r:hdrRow, c:5})].v = "รวมทั้งเดือน";
  moveRows.forEach((_,i)=>{
    const rr = summaryStartRow + i;
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:5}), {alignment:{horizontal:"left"}, fill:{fgColor:{rgb:"FDE9F0"}}});
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:8}), {font:{bold:true}, alignment:{horizontal:"center"}, fill:{fgColor:{rgb:"FFF4E0"}}});
  });

  return ws;
}

function buildHattakanSummarySheet(monthList, totalsByMonth){

  const flatItems = [];
  PROC_GROUPS.forEach(g=>{
    flatItems.push({group:true, label:g.title});
    g.items.forEach(([key,label,unit])=> flatItems.push({group:false, key, label, unit}));
  });

  flatItems.forEach(item=>{
    if(item.group){ aoa.push([item.label]); return; }
    const row = [item.label, item.unit];
    let grand = 0;
    monthList.forEach(m=>{
      const v = (totalsByMonth[`${m.year}-${m.month1}`] || {})[item.key] || 0;
      row.push(v || "");
      grand += v;
    });
    row.push(grand || "");
    aoa.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const nCols = monthList.length + 2;
  ws["!cols"] = [{wch:42},{wch:7}].concat(Array(monthList.length).fill({wch:10}), [{wch:12}]);
  ws["!freeze"] = {xSplit:2, ySplit:3};
  ws["!merges"] = [{s:{r:0,c:0}, e:{r:0,c:nCols}}];

  styleCell(ws, "A1", {font:{bold:true, sz:14, color:{rgb:"0D3B8C"}}, alignment:{horizontal:"center"}});
  for(let c=0; c<=nCols; c++){
    styleCell(ws, XLSX.utils.encode_cell({r:2, c}),
      {font:{bold:true, color:{rgb:"0D3B8C"}}, fill:{fgColor:{rgb:"E8F0FD"}}, alignment:{horizontal:"center"}});
  }
  let r = 3;
  flatItems.forEach(item=>{
    if(item.group){
      for(let c=0; c<=nCols; c++){
        styleCell(ws, XLSX.utils.encode_cell({r, c}),
          {font:{bold:true, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
      }
    } else {
      styleCell(ws, XLSX.utils.encode_cell({r, c:0}), {alignment:{horizontal:"left", wrapText:true}});
      styleCell(ws, XLSX.utils.encode_cell({r, c:1}), {alignment:{horizontal:"center"}});
      for(let c=2; c<nCols; c++) styleCell(ws, XLSX.utils.encode_cell({r, c}), {alignment:{horizontal:"center"}});
      styleCell(ws, XLSX.utils.encode_cell({r, c:nCols}),
        {font:{bold:true}, fill:{fgColor:{rgb:"FFF4E0"}}, alignment:{horizontal:"center"}});
    }
    r++;
  });
  return ws;
}

/* ---------------- export mode: รายวัน vs รายเดือน ---------------- */
let exportMode = "day";
document.querySelectorAll(".exp-mode-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".exp-mode-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    exportMode = btn.dataset.mode;
    document.getElementById("exp-day-row").style.display   = exportMode==="day"   ? "flex" : "none";
    document.getElementById("exp-month-row").style.display = exportMode==="month" ? "flex" : "none";
  });
});
// the chosen months, validated; null if the inputs are bad
function getSelectedMonths(){
  const fromVal = document.getElementById("mr-from").value;
  const toVal = document.getElementById("mr-to").value;
  if(!fromVal || !toVal){ showPopup("กรุณาเลือกเดือนเริ่มต้นและเดือนสิ้นสุดก่อน Export"); return null; }
  const [fy, fm] = fromVal.split("-").map(Number);
  const [ty, tm] = toVal.split("-").map(Number);
  if(fy*12+fm > ty*12+tm){ showPopup("เดือนเริ่มต้นต้องมาก่อนเดือนสิ้นสุด"); return null; }
  const list = [];
  let y = fy, m = fm;
  while(y*12+m <= ty*12+tm){
    list.push({year:y, month1:m});
    m++; if(m > 12){ m = 1; y++; }
    if(list.length > 36){ showPopup("เลือกช่วงได้ไม่เกิน 36 เดือน"); return null; }
  }
  return { list, fromVal, toVal };
}
function getSelectedDate(){ return document.getElementById("exp-date").value || currentDateKey; }

/* ---------------- หัตถการ ---------------- */
function exportHattakanMonths(){
  saveStore();
  const sel = getSelectedMonths();
  if(!sel) return;
  const wb = XLSX.utils.book_new();
  const totalsByMonth = {};
  sel.list.forEach(mo=>{
    const { ws, monthTotals } = buildHattakanMonthSheet(mo.year, mo.month1);
    totalsByMonth[`${mo.year}-${mo.month1}`] = monthTotals;
    XLSX.utils.book_append_sheet(wb, ws, `${THAI_MONTHS[mo.month1]}${String(mo.year+543).slice(-2)}`);
  });
  XLSX.utils.book_append_sheet(wb, buildHattakanSummarySheet(sel.list, totalsByMonth), "สรุปรวม");
  wb.SheetNames.unshift(wb.SheetNames.pop()); // summary first
  XLSX.writeFile(wb, `หัตถการ_${sel.fromVal}_ถึง_${sel.toVal}.xlsx`);
}
function exportHattakanDay(){
  saveStore();
  const key = getSelectedDate();
  const [y,m,d] = key.split("-").map(Number);
  const { ws } = buildHattakanMonthSheet(y, m, d);   // same styled sheet, single day only
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${THAI_MONTHS[m]}${String(y+543).slice(-2)}`);
  XLSX.writeFile(wb, `หัตถการ_${key}.xlsx`);
}

/* ---------------- PDF ---------------- */
async function exportPdfRange(){
  const btn = document.getElementById("btn-export-pdf");
  const labelSpan = btn.querySelector("span:last-child");
  const original = labelSpan.innerHTML;
  btn.disabled = true;
  saveStore();
  try{
    if(exportMode === "day"){
      labelSpan.innerHTML = "⏳ กำลังสร้าง PDF...";
      const key = getSelectedDate();
      const pdf = await buildPdfDoc(key);
      pdf.save(`บันทึกเหตุการณ์รายวัน_${key}.pdf`);
      return;
    }
    const sel = getSelectedMonths();
    if(!sel) return;
    // every recorded day inside the chosen months, one page each
    const keys = Object.keys(allDays).filter(k=>{
      const [y,m] = k.split("-").map(Number);
      return sel.list.some(mo=> mo.year===y && mo.month1===m);
    }).sort();
    if(!keys.length){ showPopup("ไม่พบข้อมูลที่บันทึกไว้ในช่วงเดือนที่เลือก"); return; }

    let merged = null;
    for(let i=0; i<keys.length; i++){
      labelSpan.innerHTML = `⏳ กำลังสร้าง PDF... (${i+1}/${keys.length})`;
      const pdf = await buildPdfDoc(keys[i]);
      if(!merged){ merged = pdf; }
      else {
        // append this day's pages onto the growing document
        const pages = pdf.internal.pages;
        for(let p=1; p<pages.length; p++){
          merged.addPage();
          merged.internal.pages[merged.internal.pages.length-1] = pages[p];
        }
      }
    }
    merged.save(`บันทึกเหตุการณ์_${sel.fromVal}_ถึง_${sel.toVal}.pdf`);
  }catch(err){
    showPopup(`สร้าง PDF ไม่สำเร็จ:\n${err.message || err}`);
  }finally{
    labelSpan.innerHTML = original;
    btn.disabled = false;
  }
}

document.getElementById("btn-export-hattakan").addEventListener("click", ()=>{
  exportMode === "month" ? exportHattakanMonths() : exportHattakanDay();
});
document.getElementById("btn-export-p4pdaily").addEventListener("click", ()=>{
  exportMode === "month" ? exportP4pMonths() : exportP4pDay();
});
document.getElementById("btn-export-pdf").addEventListener("click", exportPdfRange);
